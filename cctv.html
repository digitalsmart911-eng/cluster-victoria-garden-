<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV Lingkungan RT/RW</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #1f2937;
}

.header {
    background: #123b2a;
    color: white;
    padding: 25px 30px;
}

.header h1 {
    font-size: 25px;
}

.header p {
    margin-top: 6px;
    opacity: .8;
}

.container {
    padding: 30px;
    max-width: 1200px;
    margin: auto;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #176b48;
    text-decoration: none;
}

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.title h2 {
    color: #123b2a;
}

.status {
    background: #e7f5ec;
    color: #176b48;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.cctv-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.camera {
    background: #18201c;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

.screen {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    color: white;
    background:
        linear-gradient(
            rgba(0,0,0,.15),
            rgba(0,0,0,.15)
        ),
        #26332c;
}

.camera-info {
    background: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.camera-info h3 {
    font-size: 15px;
    margin-bottom: 5px;
}

.camera-info p {
    font-size: 11px;
    color: #777;
}

.online {
    color: #159447;
    font-size: 11px;
    font-weight: bold;
}

.offline {
    color: #d64545;
    font-size: 11px;
    font-weight: bold;
}

@media(max-width:700px) {
    .container {
        padding: 15px;
    }

    .cctv-grid {
        grid-template-columns: 1fr;
    }

    .screen {
        height: 220px;
    }

    .title {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📹 CCTV Lingkungan</h1>
    <p>Pemantauan keamanan lingkungan RT / RW</p>
</div>

<div class="container">

<a href="index.html" class="back">
    ← Kembali ke Dashboard
</a>

<div class="title">
    <h2>Daftar CCTV</h2>
    <div class="status">● 4 Kamera Aktif</div>
</div>

<div class="cctv-grid">

    <div class="camera">
        <div class="screen">📹</div>
        <div class="camera-info">
            <div>
                <h3>Gerbang Utama</h3>
                <p>CCTV-001</p>
            </div>
            <span class="online">● ONLINE</span>
        </div>
    </div>

    <div class="camera">
        <div class="screen">📹</div>
        <div class="camera-info">
            <div>
                <h3>Jalan Utama</h3>
                <p>CCTV-002</p>
            </div>
            <span class="online">● ONLINE</span>
        </div>
    </div>

    <div class="camera">
        <div class="screen">📹</div>
        <div class="camera-info">
            <div>
                <h3>Pos Security</h3>
                <p>CCTV-003</p>
            </div>
            <span class="online">● ONLINE</span>
        </div>
    </div>

    <div class="camera">
        <div class="screen">📹</div>
        <div class="camera-info">
            <div>
                <h3>Area Parkir</h3>
                <p>CCTV-004</p>
            </div>
            <span class="online">● ONLINE</span>
        </div>
    </div>

</div>

</div>

</body>
</html>
